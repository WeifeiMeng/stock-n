services:
  backend:
    image: ${BACKEND_IMAGE_REF:-stock-calculator-backend:0.2.0}
    container_name: stock-calculator-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock-network

  frontend:
    image: ${FRONTEND_IMAGE_REF:-stock-calculator-frontend:0.2.0}
    container_name: stock-calculator-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge
